    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NURIOH LAB" />
    <link rel="manifest" href="./manifest.json" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>🧪 [LAB 연구실] NURIOH AI TRADER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      }
      code, pre, .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

  </head>
  <body class="bg-[#0B0E14] text-slate-100 antialiased selection:bg-purple-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <!-- 카카오 Javascript SDK (v1 팝업 로그인 지원) -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/1.43.0/kakao.min.js"></script>
    <!-- PWA Service Worker 등록 (데스크톱/모바일 웹앱 설치 지원) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          const swPath = (window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/').replace(/\/index\.html$/, '/') + 'sw.js';
          navigator.serviceWorker.register(swPath).then(function(reg) {
            console.log('🧪 [LAB] PWA Service Worker Registered:', reg.scope);
          }).catch(function(err) {
            console.warn('PWA registration:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
