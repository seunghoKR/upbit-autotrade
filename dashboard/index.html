<!doctype html>
<html lang="ko" class="dark overflow-x-hidden">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 🔒 [보안서버 HTTPS 자동 전환] 외부 도메인 접속 시 HTTP -> HTTPS 0초 즉시 전환
      (function() {
        var h = window.location.hostname;
        var p = window.location.protocol;
        var isLocal = h === 'localhost' || h === '127.0.0.1' || h.startsWith('192.168.') || h.startsWith('10.');
        if (p === 'http:' && !isLocal) {
          window.location.replace('https://' + window.location.host + window.location.pathname + window.location.search + window.location.hash);
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Any Life AI" />
    <link rel="manifest" href="./manifest.json" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Any Life AI - Smart Trading for Any Lifestyle. (v5.4.0)</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body, button, input, select, textarea, table {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, Roboto, sans-serif !important;
      }
      code, pre {
        font-family: 'JetBrains Mono', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      }
      .font-mono {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif !important;
        font-feature-settings: "tnum";
        font-variant-numeric: tabular-nums;
      }
      /* 🌟 90% PC 와이드 레이아웃 컨테이너 (모바일 100% / 태블릿 95% / PC 정확히 90%) */
      .app-container-80 {
        width: 100%;
        margin-left: auto;
        margin-right: auto;
      }
      @media (min-width: 640px) {
        .app-container-80 {
          width: 95%;
        }
      }
      @media (min-width: 1024px) {
        .app-container-80 {
          width: 90% !important;
          max-width: 1920px !important;
        }
      }
    </style>
  </head>
  <body class="bg-[#0B0E14] text-slate-100 antialiased selection:bg-purple-500 selection:text-white min-h-screen w-full max-w-full overflow-x-hidden">
    <div id="root" class="w-full max-w-full overflow-x-hidden"></div>
    <!-- 카카오 Javascript SDK (v1 팝업 로그인 지원) -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/1.43.0/kakao.min.js"></script>
    <!-- PWA Service Worker 등록 (데스크톱/모바일 웹앱 설치 지원) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          const swPath = (window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/').replace(/\/index\.html$/, '/') + 'sw.js';
          navigator.serviceWorker.register(swPath).then(function(reg) {
            console.log('🧪 [LAB] PWA Service Worker Registered:', reg.scope);
          }).catch(function(err) {
            console.warn('PWA registration:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
