<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 다크 라운드 카드 배경 -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- 상승 막대 1 (좌측) -->
  <rect x="14" y="34" width="8" height="16" rx="4" fill="url(#barGrad)" filter="url(#glow)"/>

  <!-- 상승 막대 2 (중앙) -->
  <rect x="26" y="24" width="8" height="26" rx="4" fill="url(#barGrad)" filter="url(#glow)"/>

  <!-- 상승 막대 3 (우측) -->
  <rect x="38" y="14" width="8" height="36" rx="4" fill="url(#barGrad)" filter="url(#glow)"/>

  <!-- 상승 꺾은선 추세선 & 화살표 -->
  <path d="M12 40 L26 27 L36 31 L47 15" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M41 15 H47 V21" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
